<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Klien - Clovis AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-layout">

    <div class="auth-card">
        <div class="brand" style="justify-content: center;">🚀 Clovis<span>AI</span></div>
        <h2>Masuk ke Dasbor</h2>
        
        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email Terdaftar</label>
                <input type="email" id="email" name="email" placeholder="nama@perusahaan.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #6b7280;">
            Belum menjadi klien? <a href="register.html" style="color: #2563eb; text-decoration: none; font-weight: 500;">Daftar di sini</a>
        </p>
        <p style="text-align: center; margin-top: 10px; font-size: 0.85rem;">
            <a href="index.html" style="color: #9ca3af; text-decoration: none;">&larr; Kembali ke Beranda</a>
        </p>
    </div>

</body>
